version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: globetrotter_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: globetrotter_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globetrotter_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/globetrotter_db?sslmode=disable"
      JWT_SECRET: "globetrotter_super_secret_jwt_key_2026"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: globetrotter_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
